<style>

:root[data-theme="dark"]{--bg:#0b1324;--card:#131d33;--ink:#e8eefc;--mute:#92a3c6;--line:#243252;--acc:#ffa94d;--sky:#5aa9ff;--on:#0b1324;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(28px,5vw,40px);margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1 1 280px;min-width:0}
.pass{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
.pass b{display:block;font-size:34px;line-height:1;font-weight:800}.pass span{color:var(--mute);font-size:13px}
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.d{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;font:inherit}
.d b{display:block;font-weight:800}.d small{color:var(--mute)}
.d[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
label{font-weight:600;font-size:14px;display:block;margin:12px 0 6px}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer;font-size:16px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600;font-size:14px;padding:9px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.hide{display:none!important}
.win{position:relative;height:clamp(240px,42vw,340px);border-radius:46% / 34%;overflow:hidden;border:10px solid #c9d1de;box-shadow:inset 0 0 0 4px #9aa6b8,0 4px 18px rgba(0,0,0,.25);background:linear-gradient(var(--t,#2b5aa8),var(--b,#f6a86b))}
.cl{position:absolute;left:100%;background:#fff;opacity:.85;border-radius:50px;filter:blur(6px);animation:dr linear infinite}
@keyframes dr{to{transform:translateX(-160vw)}}
.paused .cl,.paused .wing,.paused .gnd{animation-play-state:paused}
.wing{position:absolute;bottom:-4px;left:-4%;width:70%;height:34%;transform-origin:0 100%;animation:wob 3.5s ease-in-out infinite}@keyframes wob{50%{transform:rotate(-.7deg) translateY(2px)}}@keyframes shk{25%{transform:translate(1.5px,-1px)}75%{transform:translate(-1.5px,1px)}}#win.turb{animation:shk .12s linear infinite}#win.turb .wing{animation-duration:.2s}.stars{position:absolute;inset:0;opacity:0}.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}.sun{position:absolute;width:150px;height:150px;border-radius:50%;transform:translate(-50%,-50%);left:82%;top:16%;background:radial-gradient(circle,#fffbe6 0 12%,rgba(255,214,102,.7) 26%,rgba(255,170,60,0) 70%)}.gnd{position:absolute;left:-25%;right:-25%;bottom:-8%;height:60%;transform-origin:50% 100%;opacity:.3;background:repeating-linear-gradient(100deg,#476f35 0 34px,#6f9246 34px 66px,#9a9650 66px 90px),repeating-linear-gradient(10deg,rgba(255,255,255,.12) 0 18px,rgba(0,0,0,.1) 18px 44px);-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%);animation:gs 60s linear infinite}@keyframes gs{to{background-position:-1200px 0,-600px 0}}.fog{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.gl .stars,.gl .sun,.gl .gnd,.gl .wing,.gl .cl{display:none}.cap{min-height:22px;margin:6px 0 0;font-size:14px;color:var(--acc);font-weight:600;opacity:0;transition:opacity .4s}.rk{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}.rk b{font-size:18px}.rk span{color:var(--mute);font-size:13px}.shade{position:absolute;inset:0;background:repeating-linear-gradient(#e7e2d8 0 14px,#d4cec1 14px 16px);transform:translateY(-100%);transition:transform .7s cubic-bezier(.3,.7,.2,1)}.shade.on{transform:none}.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28) 0,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%)}

.hud div{background:var(--bg);border-radius:10px;padding:8px 10px}.hud small{color:var(--mute);display:block;font-size:12px}.hud b{font-size:20px}
.big{font-size:clamp(48px,12vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin:14px 0 2px}
.phase{color:var(--acc);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
svg.map{width:100%;height:auto;display:block}
.stamps{display:flex;flex-wrap:wrap;gap:8px}.stamp{border:2px solid var(--acc);color:var(--acc);border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px;transform:rotate(-3deg)}
.ctr{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e3e8f2;--acc:#5b5bf0;--sky:#0ea5e9;--on:#fff;--sh:0 1px 2px rgba(15,23,42,.04),0 10px 32px rgba(15,23,42,.07)}

main{max-width:1040px;padding:28px 20px 56px}

section{animation:fi .45s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.card{border-radius:22px;padding:22px;box-shadow:var(--sh)}

.dests{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

</style></head><body><main>
<h1>Focus Airlines</h1>
<p class="sub">Board a flight, study until you land. The farther the destination, the longer the session.</p>

<section id="gate">
 <div class="row">
  <div class="card">
   <div class="pass"><div><span>From</span><b>BOM</b><span>Mumbai, India</span></div><div style="font-size:28px" aria-hidden="true">✈</div><div style="text-align:right"><span>To</span><b id="toCode">—</b><span id="toName">Choose below</span></div></div>
   <div class="dests" id="dests" role="group" aria-label="Destination"></div>
  </div>
  <div class="card">
   <label for="topic">What are you studying?</label>
   <input type="text" id="topic" placeholder="e.g. Signals &amp; Systems, chapter 4" maxlength="60">
   <label>Pace: focus minutes per flight hour</label>
   <div class="seg" id="pace" role="group" aria-label="Pace"></div><label>Departure time (Mumbai)</label><div class="seg" id="dep" role="group" aria-label="Departure"></div>
   <p id="plan" class="sub" style="margin:14px 0 10px"></p>
   <button class="btn" id="board">Board flight</button>
  </div>
 </div>
 <div class="card"><div class="rk"><b id="rank"></b><span id="mi"></span></div><div class="bar"><i id="rbar"></i></div><div class="stamps" id="stamps"></div><p class="sub" id="tot" style="margin:8px 0 0"></p></div>
</section>

<section id="fly" class="hide">
 <div class="card">
  <div class="win" id="win"><div class="stars" id="stars"></div><div class="sun" id="sun"></div><div class="gnd" id="gnd"></div>
   <svg id="wing" class="wing" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true"><path d="M0 110 L0 40 Q120 30 400 90 L400 110Z" fill="#dfe5ee"/><path d="M0 110 L0 62 Q150 58 400 100 L400 110Z" fill="#aeb8c8"/><circle cx="388" cy="92" r="4" fill="#ff3b30"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></circle></svg><div class="fog" id="fog"></div><div class="glare"></div><div class="shade" id="shade"></div>
  </div>
  <div class="big" id="clock">00:00</div>
  <div class="phase" id="phase">Boarding</div>
  <div class="sub" id="studying" style="margin:2px 0 0"></div><div class="cap" id="cap"></div><div class="sub" id="over" style="margin:2px 0 0;font-size:13px"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="hud"><div><small>Altitude</small><b id="alt">0 ft</b></div><div><small>Ground speed</small><b id="spd">0 km/h</b></div><div><small>Distance to go</small><b id="dist">0 km</b></div><div><small>Heading to</small><b id="hd">—</b></div></div>
  <div class="ctr"><button class="btn alt" id="pause">Pause (seatbelt sign on)</button><button class="btn alt" id="snd">Sound: on</button><button class="btn alt" id="shd">Window shade</button><button class="btn alt" id="divert">Divert &amp; end early</button></div>
 </div>
</section>

<section id="land" class="hide">
 <div class="card"><h2 id="lh" style="margin:0 0 6px;font-size:28px"></h2><p id="lp" class="sub"></p><button class="btn" id="again">Book another flight</button></div>
</section>

<div class="card"><svg class="map" id="map" viewBox="0 0 720 340" role="img" aria-label="Flight route map"></svg></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var O={name:"Mumbai",code:"BOM",lat:19.09,lon:72.87};
var D=[["Dubai","DXB","UAE",25.25,55.36],["Bangkok","BKK","Thailand",13.69,100.75],["Singapore","SIN","Singapore",1.36,103.99],["Paris","CDG","France",49.0,2.55],["London","LHR","UK",51.47,-0.45],["Tokyo","HND","Japan",35.55,139.78],["Sydney","SYD","Australia",-33.94,151.18],["Toronto","YYZ","Canada",43.68,-79.63],["New York","JFK","USA",40.64,-73.78]].map(function(a){return{name:a[0],code:a[1],country:a[2],lat:a[3],lon:a[4]}});
var W=720,H=340,LAT0=75,LAT1=-50;

function hav(a,b){var r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 12742*Math.asin(Math.sqrt(x))}
D.forEach(function(d){d.km=Math.round(hav(O,d)/10)*10;d.hrs=d.km/850+0.5});
var sel=D[0],pace=15,paces=[10,15,25],S=null,$=function(i){return document.getElementById(i)};
function fmt(m){var s=Math.round(m*60);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function hm(h){return Math.floor(h)+"h "+String(Math.round((h%1)*60)).padStart(2,"0")+"m"}
function store(){try{return JSON.parse(localStorage.getItem("ff")||"null")||{mins:0,f:[]}}catch(e){return{mins:0,f:[]}}}
function save(s){try{localStorage.setItem("ff",JSON.stringify(s))}catch(e){}}

function buildDests(){var h="";D.forEach(function(d,i){h+='<button class="d" data-i="'+i+'" aria-pressed="'+(d===sel)+'"><b>'+d.name+'</b><small>'+d.km.toLocaleString()+' km · '+Math.round(d.hrs*pace)+' min focus</small></button>'});$("dests").innerHTML=h;
 $("dests").querySelectorAll("button").forEach(function(b){b.onclick=function(){sel=D[+b.dataset.i];buildDests();info()}})}
function buildPace(){var h="";paces.forEach(function(p){h+='<button data-p="'+p+'" aria-pressed="'+(p===pace)+'">'+p+' min</button>'});$("pace").innerHTML=h;
 $("pace").querySelectorAll("button").forEach(function(b){b.onclick=function(){pace=+b.dataset.p;buildPace();buildDests();info()}})}
function info(){$("toCode").textContent=sel.code;$("toName").textContent=sel.name+", "+sel.country;
 $("plan").textContent="Flight time "+hm(sel.hrs)+" → "+Math.round(sel.hrs*pace)+" minutes of focus.";drawMap(0)}
function stamps(){var s=store(),h="";rankUI(s);s.f.slice(-8).forEach(function(f){h+='<span class="stamp">'+f.c+" · "+f.m+" min</span>"});
 $("stamps").innerHTML=h||'<span class="sub" style="margin:0">Your passport is empty. Land a flight to earn your first stamp.</span>';
 $("tot").textContent=s.f.length?s.f.length+" flights, "+(s.mins/60).toFixed(1)+" hours of focus in total.":""}

var pathEl;
function drawMap(t){var g=landmass();for(var la=60;la>=-30;la-=30)g+='<line x1="0" x2="'+W+'" y1="'+Y(la)+'" y2="'+Y(la)+'" stroke="var(--line)"/>';
 for(var lo=-150;lo<=180;lo+=30)g+='<line y1="0" y2="'+H+'" x1="'+X(lo)+'" x2="'+X(lo)+'" stroke="var(--line)"/>';
 var x0=X(O.lon),y0=Y(O.lat),x1=X(sel.lon),y1=Y(sel.lat),cx=(x0+x1)/2,cy=Math.min(y0,y1)-Math.min(90,Math.abs(x1-x0)*.25+20);
 var p="M"+x0+" "+y0+" Q"+cx+" "+cy+" "+x1+" "+y1;
 g+='<path id="rp" d="'+p+'" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="4 6"/><path id="rd" d="'+p+'" pathLength="1" fill="none" stroke="var(--acc)" stroke-width="3" stroke-dasharray="1" stroke-dashoffset="'+(1-t)+'"/>';
 [[O,x0,y0],[sel,x1,y1]].forEach(function(c){g+='<circle cx="'+c[1]+'" cy="'+c[2]+'" r="5" fill="var(--ink)"/><text x="'+(c[1]+8)+'" y="'+(c[2]-8)+'" fill="var(--ink)" font-size="13" font-weight="700">'+c[0].code+'</text>'});
 D.forEach(function(d){if(d!==sel)g+='<circle cx="'+X(d.lon)+'" cy="'+Y(d.lat)+'" r="2.5" fill="var(--mute)"/>'});g+='<g id="pl" transform="translate('+x0+','+y0+')"><path d="M-11 0L-4-2.5-2-10 1.5-10 0-2.5 9-1.5 12 0 9 1.5 0 2.5 1.5 10-2 10-4 2.5Z" fill="var(--acc)" stroke="var(--bg)" stroke-width="1.5"/></g>';
 $("map").innerHTML=g;pathEl=$("rp");movePlane(t)}
function movePlane(t){if(!pathEl)return;var L=pathEl.getTotalLength(),a=pathEl.getPointAtLength(Math.max(0,t*L-1)),b=pathEl.getPointAtLength(Math.min(L,t*L+1));
 $("pl").setAttribute("transform","translate("+b.x+","+b.y+") rotate("+(Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI)+")");
 var r=$("rd");if(r)r.setAttribute("stroke-dashoffset",1-t)}

var stops=[[0,"#2b5aa8","#f6a86b"],[.4,"#1e6fd9","#a8d8ff"],[.8,"#2a5db0","#ff9a62"],[1,"#101c44","#ff6b4a"]];
function hx(c){return[1,3,5].map(function(i){return parseInt(c.substr(i,2),16)})}
function mix(a,b,u){a=hx(a);b=hx(b);return"rgb("+a.map(function(v,i){return Math.round(v+(b[i]-v)*u)}).join(",")+")"}
function sky(t){for(var i=1;i<stops.length;i++){if(t<=stops[i][0]){var p=stops[i-1],n=stops[i],u=(t-p[0])/(n[0]-p[0]);$("win").style.setProperty("--t",mix(p[1],n[1],u));$("win").style.setProperty("--b",mix(p[2],n[2],u));return}}}
function clouds(){var w=$("win");w.querySelectorAll(".cl").forEach(function(c){c.remove()});
 for(var i=0;i<12;i++){var n=i>5,c=document.createElement("div");c.className="cl";var s=n?120+Math.random()*180:50+Math.random()*80;c.style.cssText="top:"+(n?40+Math.random()*50:15+Math.random()*50)+"%;width:"+s+"px;height:"+(s*.28)+"px;filter:blur("+(n?9:4)+"px);animation-duration:"+(n?12+Math.random()*8:26+Math.random()*24)+"s;animation-delay:-"+(Math.random()*40)+"s;opacity:"+(n?.75:.4+Math.random()*.3);w.insertBefore(c,$("wing"))}}

/* cabin hum: brown noise */
var ac,gn;function hum(on){if(on){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();var n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),l=0;for(var i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
 var s=ac.createBufferSource();s.buffer=b;s.loop=true;var f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=500;gn=ac.createGain();gn.gain.value=.5;s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start()}catch(e){return false}}
